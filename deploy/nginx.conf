# Neurotlon: HTTPS front for the web client and the API. Goes to /etc/nginx/conf.d/ (http context).

server_tokens off;
client_max_body_size 1m;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
gzip_min_length 512;

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # Mounted from deploy/certs (made by make-certs.ps1).
    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's own DNS, so a restarted server container is found again without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://server:8000;

    # --- API ---------------------------------------------------------------------------------
    # No CSP here: badges.pdf is opened in the browser's PDF viewer.
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        include /etc/nginx/neurotlon-security-headers.conf;
    }

    # Server-sent events: no buffering, no compression, connection stays open for hours.
    location = /api/v1/scoreboard/stream {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        include /etc/nginx/neurotlon-security-headers.conf;
    }

    location = /health {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        include /etc/nginx/neurotlon-security-headers.conf;
    }

    # --- Web client --------------------------------------------------------------------------
    # The service worker and the manifest must never come from a stale cache.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/neurotlon-security-headers.conf;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/neurotlon-security-headers.conf;
    }

    # File names under /assets/ carry a content hash.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/neurotlon-security-headers.conf;
        try_files $uri =404;
    }

    # Every page is the same single-page app; the browser router picks the screen.
    # CSP: everything from our own origin, the camera stream and canvas (jsqr) need no exceptions,
    # no external hosts. Inline styles are allowed because React sets style attributes.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        include /etc/nginx/neurotlon-security-headers.conf;
    }

    location ~ ^/(admin|judge|board|tablet|overlay)(/.*)?$ {
        try_files $uri /index.html;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        include /etc/nginx/neurotlon-security-headers.conf;
        try_files $uri =404;
    }
}

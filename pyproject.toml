[project]
name = "neurotlon"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "neurotlon_server",
    "neurotlon_launcher",
    "neurotlon_bridge",
    "neurotlon_games",
    "neurotlon_contracts",
]

[tool.uv]
package = false

[tool.uv.sources]
neurotlon_server = { workspace = true }
neurotlon_launcher = { workspace = true }
neurotlon_bridge = { workspace = true }
neurotlon_games = { workspace = true }
neurotlon_contracts = { workspace = true }

[tool.uv.workspace]
members = ["server", "launcher", "bci-bridge", "games", "shared/python"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "jsonschema>=4.26.0",
    "mypy>=1.13",
    "openapi-spec-validator>=0.9.0",
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
    "scipy-stubs>=1.18.1.1",
    "types-jsonschema>=4.26.0.20261006",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# проект русскоязычный: однобуквенные слова («с», «о») не считаем путаницей с латиницей
allowed-confusables = ["а", "с", "е", "о", "р", "х", "у", "г", "б", "Н", "Т", "В", "К", "М", "А", "Е", "О", "Р", "С", "Х"]

[tool.ruff.lint.isort]
known-first-party = ["neurotlon_contracts", "neurotlon_server", "neurotlon_launcher", "neurotlon_bridge", "neurotlon_games"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["shared/python/src", "server/src", "launcher/src", "bci-bridge/src", "games/src"]
files = ["shared/tests", "shared/python", "server", "launcher", "bci-bridge", "games"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["shared/tests", "shared/python/tests", "server/tests", "launcher/tests", "bci-bridge/tests", "games/tests"]
addopts = "--import-mode=importlib"

[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*", "neurosdk", "neurosdk.*", "em_st_artifacts", "em_st_artifacts.*"]
ignore_missing_imports = true

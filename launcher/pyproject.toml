[project]
name = "neurotlon_launcher"
version = "0.1.0"
description = "Station launcher"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2>=2.16.2",
    "jsonschema>=4.26.0",
    "neurotlon_games",
    "opencv-python-headless>=5.1.0.95",
    "pygame-ce>=2.5.8",
]

[project.scripts]
neurotlon-launcher = "neurotlon_launcher.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurotlon_launcher"]

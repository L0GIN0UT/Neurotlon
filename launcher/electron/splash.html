<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Нейротлон</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0f1a;
        color: #e8ecf5;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
        padding: 0 24px;
        box-sizing: border-box;
      }
      img {
        width: 128px;
        height: 128px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
      }
      #detail {
        margin: 0;
        max-width: 720px;
        color: #8d99b3;
        font-size: 16px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 4px solid #1f2a44;
        border-top-color: #4f8cff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .actions {
        display: none;
        gap: 12px;
      }
      a.button {
        padding: 12px 28px;
        border-radius: 10px;
        border: 1px solid #2c3a5c;
        color: #e8ecf5;
        text-decoration: none;
        font-size: 16px;
      }
      a.primary {
        background: #4f8cff;
        border-color: #4f8cff;
        color: #08101f;
        font-weight: 600;
      }
      body[data-state='error'] .spinner {
        display: none;
      }
      body[data-state='error'] .actions {
        display: flex;
      }
      body[data-state='error'] h1 {
        color: #ff8a80;
      }
    </style>
  </head>
  <body data-state="starting">
    <main>
      <img src="build/icon.png" alt="" />
      <h1 id="title">Запуск стенда…</h1>
      <div class="spinner"></div>
      <p id="detail">Подождите, идёт запуск…</p>
      <div class="actions">
        <a class="button primary" href="app://action/retry">Повторить</a>
        <a class="button" href="app://action/close">Закрыть</a>
      </div>
    </main>
  </body>
</html>

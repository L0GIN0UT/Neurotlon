# Скопируйте в launcher.toml (он в .gitignore). Относительные пути считаются от папки этого файла.

server_url = "https://192.168.1.10:8443"  # ПК админа в локальной сети, только https
ca_file = "hall-ca.crt"                 # корневой сертификат зала (тот же, что на планшетах)
# allow_insecure_http = true             # ТОЛЬКО для разработки: разрешает http://, токен идёт открыто
fallback_duration_s = 240                 # время игры, если настройки с сервера ещё ни разу не получены
token_file = "station.token"              # файл с токеном станции (в .gitignore); сам токен сюда не пишем
discipline = "darts"                      # darts | football | pong
data_dir = "data"                         # буфер результатов, кэш настроек, папки сессий
camera_index = 0                          # номер вебки для QR

[game]
# Команда запуска; лаунчер допишет: --launch <путь к launch.json>
# pygame-ce:  ["python", "-m", "neurotlon_games.darts"]
# Unity:      ["games/darts/Darts.exe"]
# Разработка без игры: заглушка, ждёт пару секунд и пишет случайный результат
command = ["python", "-m", "neurotlon_games.stub"]
# workdir = "games/darts"                 # рабочая папка игры, по умолчанию текущая

[bridge]
host = "127.0.0.1"
port = 8765

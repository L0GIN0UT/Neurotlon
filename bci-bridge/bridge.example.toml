# Скопируйте в bridge.toml (он в .gitignore) и назначьте датчики.
# Список найденных датчиков: uv run neurotlon-bridge --scan

[devices]
scan_s = 12.0   # сколько секунд (самое большее) искать датчик при старте; находится раньше - идём дальше
# (обычные ключи, scan_s и eeg = "...", пишите выше таблиц [devices.<роль>]: ниже них ключи принадлежат таблице)
# Обычно датчики назначает экран настройки стенда в лаунчере и сам пишет этот раздел.
# Вручную (для разработки) подойдёт любой из двух видов записи, роль = сигнал профиля:
#   eeg                BrainBit (дартс, футбол)
#   emg                Callibri (дартс, футбол)
#   emg_left, emg_right  два Callibri (понг: игрок 1 слева, игрок 2 справа)
#
# Старый вид: только серийный номер.
# eeg = "BB-100200"
#
# Новый вид: адрес - главный ключ, серийный номер - запасной, если адрес сменился.
# [devices.emg_left]
# address = "D8:AA:00:00:00:02"
# serial = "CA-204816"
# name = "Callibri_Red"
# kind = "callibri"

# Параметры ниже можно не трогать: это значения, проверенные на железе.
[emg]
fs_nominal = 1000          # Гц в режиме ЭМГ
band_low_hz = 20
band_high_hz = 450
notch_hz = 50
notch_q = 30
rms_window_ms = 100
rms_step_ms = 20
settle_s = 5.0             # после подключения сигнал оседает, это время RMS не считается
calib_rest_s = 5.0         # шаг rest
calib_contractions = 3     # шаг contract: столько сокращений
calib_contraction_s = 3.0  # длительность одного сокращения
calib_pause_s = 1.0        # пауза между сокращениями
calib_min_ratio = 2.0      # максимум (90-й перцентиль напряжения) должен быть выше покоя во столько раз
calib_noise_k = 4.0        # и отличаться от покоя не меньше чем на столько разбросов покоя
cycle_tense_s = 5.0        # шаг cycle по умолчанию: напряжение, расслабление, и так cycle_repeats раз
cycle_relax_s = 5.0
cycle_repeats = 2
transition_s = 1.5         # первые секунды каждого сегмента cycle в расчёт не идут

[burst]                    # резкое сокращение мышцы: запускает бросок и удар в дартсе и футболе
arm_level = 0.3            # взвод: уровень ниже этого значения
arm_window_ms = 400        # ...в течение этого времени перед ростом
rise_window_ms = 150       # за это время уровень должен вырасти
min_rise = 0.4             # ...не меньше чем на столько (доля шкалы 0..1)
fire_level = 0.5           # и дойти не ниже этого уровня
confirm_points = 3         # столько шагов RMS (по 20 мс) подряд, одиночный выброс не в счёт
release_level = 0.3        # следующее событие только после спада ниже этого уровня
release_ms = 200           # ...на столько времени
min_interval_ms = 400      # и не раньше чем через это время после прошлого события
rise_ref = 0.8             # прирост, который считается «полной резкостью» (поле rise события)

[eeg]
sampling_rate = 250
process_win_freq = 25
fft_window = 1000
n_first_sec_skipped = 4
num_wins_for_quality_avg = 125
ampl_art_extremum_border = 25
calibration_s = 12         # шаг baseline (глаза открыты), игра может задать свою длительность 5..30 с
skip_wins_after_artifact = 10

# Метод ЭЭГ (alpha или emotions) задаётся не здесь, а в настройках лаунчера (аргумент --eeg-method).
# Параметры метода alpha (относительная альфа по O1/O2) тоже можно не трогать.
[alpha]
window_s = 2.0             # окно спектра
step_s = 0.2               # шаг пересчёта
artifact_ptp_uv = 150.0    # размах в окне после фильтра, мкВ: больше - артефакт
artifact_jump_uv = 80.0    # скачок между соседними отсчётами, мкВ: больше - артефакт
gap_ms = 300.0             # пауза в данных, после которой окно набирается заново
calib_low_pct = 5.0        # перцентиль калибровки, дающий 0
calib_high_pct = 50.0      # перцентиль калибровки (медиана), дающий 1
calib_min_values = 10      # меньше значений - калибровка не удалась

# Калибровка датчиков хранится в файле calibration.json (каталог --state-dir, по умолчанию рядом с bridge.toml)
# и переживает перезапуск моста. Файл старше ttl_h часов, от другого метода ЭЭГ или с неверными числами игнорируется.
[calibration]
ttl_h = 4.0                # сколько часов верить сохранённой калибровке

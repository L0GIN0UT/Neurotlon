[project]
name = "neurotlon_bridge"
version = "0.1.0"
description = "BrainBit / Callibri bridge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
neurotlon-bridge = "neurotlon_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurotlon_bridge"]

openapi: 3.1.0
info:
  title: Neurotlon station API
  version: 0.1.0
  description: |
    Контракт «лаунчер стенда / планшет волонтёра → сервер».

    - Лаунчер авторизуется токеном станции, планшет — сессией волонтёра.
      Дисциплина и секция берутся из учётки станции или волонтёра; если в теле
      они не совпадают — `403 wrong_discipline`.
    - Сервер ничего не назначает, только проверяет.
    - Результат принимается идемпотентно по `session_id`: повтор того же тела
      возвращает тот же ответ, другое тело с тем же `session_id` — `409`.
    - Категория участника (с ОВЗ / без) в этом API не передаётся никогда.
    - Ошибки — `application/problem+json` (RFC 9457) с машинным полем `code`.

servers:
  - url: /api/v1

security:
  - stationToken: []
  - volunteerSession: []

paths:
  /me/config:
    get:
      operationId: getConfig
      summary: Настройки дисциплины для станции или волонтёра
      description: |
        Читается перед каждой сессией и кэшируется на случай потери связи.
        Меняют админ и судья; новое значение действует со следующей сессии.
      responses:
        "200":
          description: Настройки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisciplineConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /participants/{code}/eligibility:
    get:
      operationId: getEligibility
      summary: Проверка участника перед окном «Это я»
      description: |
        Не блокирует: возвращает данные для окна «Это я» и список проблем.
        Окно жёлтое, если `issues` не пуст.
      parameters:
        - $ref: "#/components/parameters/ParticipantCodePath"
        - name: discipline
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Discipline"
        - name: section
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Section"
      responses:
        "200":
          description: Участник найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Eligibility"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"

  /sessions:
    post:
      operationId: startSession
      summary: Участники подтвердили «Это я», игра начинается
      description: |
        Помечает участников занятыми на этой станции до прихода результата или
        до потери heartbeat. Без связи лаунчер начинает игру без этого вызова и
        передаёт результат позже. Повтор с тем же `session_id` безопасен.
      security:
        - stationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionStart"
      responses:
        "201":
          description: Сессия открыта
        "200":
          description: Сессия с этим `session_id` уже открыта
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /results:
    post:
      operationId: submitResult
      summary: Результат сессии (одна игра или одна запись волонтёра)
      description: |
        Одна сессия — один запрос со всеми её участниками: на понге оба игрока
        одного матча приходят вместе. Результат из офлайн-буфера с прошедшими
        проверками всё равно принимается; найденные проблемы сервер помечает в
        `warnings`, разбирает судья.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultSubmission"
            examples:
              darts:
                value:
                  session_id: 0f8c7a52-3c1e-4c5e-9a57-2d6a3b1f9e10
                  discipline: darts
                  section: bci
                  finished_at: "2027-04-12T11:05:00+04:00"
                  entries:
                    - participant_code: NT07
                      outcome: completed
                      points: 42.5
              pong:
                value:
                  session_id: 7b1d3e00-5a4f-4c2b-8e7a-91c0d2f3a4b5
                  discipline: pong
                  section: bci
                  finished_at: "2027-04-12T11:20:00+04:00"
                  entries:
                    - participant_code: NT03
                      outcome: completed
                      points: 11
                      wins: 1
                    - participant_code: NT14
                      outcome: completed
                      points: 7
                      wins: 0
              not_completed:
                value:
                  session_id: 2c9e4f61-8d0a-4b3c-a1e2-f3d4c5b6a7e8
                  discipline: football
                  section: physical
                  finished_at: "2027-04-12T11:40:00+04:00"
                  entries:
                    - participant_code: NT11
                      outcome: not_completed
                      reason: equipment
      responses:
        "201":
          description: Результат записан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultReceipt"
        "200":
          description: Повтор того же `session_id` с тем же телом, ответ как при записи
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: |
            `session_conflict` — другое тело с тем же `session_id`;
            `result_voided` — сессия уже отменена (undo), нужен новый `session_id`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listResults
      summary: Поиск результатов (судья, админ, суперпользователь)
      security:
        - volunteerSession: []
      parameters:
        - name: participant
          in: query
          required: false
          schema:
            type: string
        - name: discipline
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Discipline"
        - name: section
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Section"
        - name: session_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SessionId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Страница результатов, в том числе аннулированных (`voided`); `total` — всего по фильтру
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredResultPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"

  /results/{session_id}/undo:
    post:
      operationId: undoResult
      summary: Отмена результата волонтёром (30 с)
      description: |
        Только сессия волонтёра, который записал результат, и не позже 30 с
        после записи. Строки результата помечаются аннулированными
        (`void_reason: undo`), событие `result.undo` пишется в аудит.
      security:
        - volunteerSession: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SessionId"
      responses:
        "204":
          description: Результат отменён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: Прошло больше 30 с или результат уже отменён (`conflict`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /corrections:
    post:
      operationId: createCorrection
      summary: Запрос судье на исправление результата
      description: |
        Для результата, который нельзя отменить (прошло больше 30 с). Только
        волонтёр, записавший эту сессию.
      security:
        - volunteerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectionCreate"
      responses:
        "201":
          description: Запрос создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Correction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listCorrections
      summary: Запросы на исправление
      description: Судья, админ и суперпользователь видят все, волонтёр — только свои.
      security:
        - volunteerSession: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CorrectionStatus"
      responses:
        "200":
          description: Список, по умолчанию открытые
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Correction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"

  /corrections/{id}/done:
    post:
      operationId: resolveCorrection
      summary: Отметить запрос выполненным
      description: Судья, админ, суперпользователь.
      security:
        - volunteerSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Запрос закрыт
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Correction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /stations/me/heartbeat:
    post:
      operationId: heartbeat
      summary: Состояние стенда, раз в 5 с
      description: Нет heartbeat 30 с — станция считается отключённой, её сессии закрываются.
      security:
        - stationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Heartbeat"
      responses:
        "204":
          description: Принято
        "401":
          $ref: "#/components/responses/Unauthorized"

  /stations:
    get:
      operationId: listStations
      summary: Станции и их состояние (админка)
      description: |
        Админ и суперпользователь. `online` — heartbeat не старше 30 с.
        Токены не возвращаются: токен виден один раз при создании и ротации.
      security:
        - volunteerSession: []
      responses:
        "200":
          description: Список станций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StationInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"

  /disciplines:
    get:
      operationId: listDisciplines
      summary: Настройки дисциплин (админка, судья)
      description: Админ, судья, суперпользователь. Меняются через `PATCH /disciplines/{code}`.
      security:
        - volunteerSession: []
      responses:
        "200":
          description: Три дисциплины
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DisciplineSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"

  /users:
    get:
      operationId: listUsers
      summary: Аккаунты (только суперпользователь)
      security:
        - volunteerSession: []
      responses:
        "200":
          description: Список аккаунтов без паролей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"

  /results/lock:
    post:
      operationId: lockResults
      summary: Зафиксировать итоги
      description: |
        Судья, админ, суперпользователь. Все подтверждённые неаннулированные
        результаты становятся `locked`; событие `result.lock` пишется в аудит.
        Повтор безопасен (`locked: 0`). В аудит пишутся `ids` заблокированных результатов. Если есть неразрешённые конфликты или
        открытые запросы на исправление — `409 conflict` с числами `conflicts` и
        `open_corrections`. `{"force": true}` фиксирует всё равно, только админ и
        суперпользователь (судье `403`); `force` и числа пишутся в аудит.
      security:
        - volunteerSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                force:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Сколько результатов заблокировано
          content:
            application/json:
              schema:
                type: object
                required: [locked]
                additionalProperties: false
                properties:
                  locked:
                    type: integer
                    minimum: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"

  /results/{id}:
    patch:
      operationId: correctResult
      summary: Исправление результата судьёй или админом
      description: |
        Судья, админ и суперпользователь правят `confirmed`; `locked` — только
        админ и суперпользователь. Проверки как при приёме результата; смена
        `outcome` сбрасывает поля другого исхода. На понге `wins: 1` делает игрока
        победителем, а второму игроку матча в той же транзакции ставится `wins: 0`
        (у обоих `version` +1, обе правки в аудите). Снять победу, не назначив
        другого победителя, нельзя (`422`). `version` растёт на 1,
        в аудит пишутся значения до и после и `change_reason`.
      security:
        - volunteerSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultPatch"
      responses:
        "200":
          description: Результат после правки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /scoreboard:
    get:
      operationId: getScoreboard
      summary: Табло (публично, без входа)
      description: |
        Снимок для большого экрана и оверлея OBS; тот же снимок приходит в потоке
        `GET /scoreboard/stream` (SSE, событие `scoreboard`). Всё вычисляется из
        результатов секций, ничего не хранится. Категории и внутренних id нет.
        `duel_score` — победы команды в понге (один матч = одно очко). `by_discipline` —
        сумма очков команды в дисциплине (физическая + BCI). `top` — до 5 лучших игроков
        команды в каждой дисциплине (очки физической + BCI).
      security: []
      responses:
        "200":
          description: Команды в порядке мест
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scoreboard"

  /teams/{id}:
    patch:
      operationId: renameTeam
      summary: Название и цвет команды (админ, суперпользователь)
      description: |
        Название — от 1 до 24 символов без пробелов по краям, цвет — `#RRGGBB`.
        Изменение попадает в журнал аудита, табло обновляется сразу.
      security:
        - volunteerSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamPatch"
      responses:
        "200":
          description: Команда после правки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /export.xlsx:
    get:
      operationId: exportXlsx
      summary: Сводная таблица в XLSX
      description: |
        Админ, суперпользователь, судья. Листы «Итоги» и «Участники»; считается
        тем же кодом, что и табло. Категории в файле нет.
      security:
        - volunteerSession: []
      responses:
        "200":
          description: Файл XLSX
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    stationToken:
      type: http
      scheme: bearer
      description: Токен станции, выдаётся в админке; одна станция — один токен.
    volunteerSession:
      type: apiKey
      in: cookie
      name: neurotlon_session

  parameters:
    ParticipantCodePath:
      name: code
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ParticipantCode"

  responses:
    Unauthorized:
      description: Нет или неверный токен / сессия
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem:
      description: Ошибка с машинным кодом
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    ParticipantCode:
      type: string
      pattern: "^NT(0[1-9]|[1-9][0-9])$"
      examples: [NT07]

    Discipline:
      type: string
      enum: [darts, football, pong]

    Section:
      type: string
      enum: [bci, physical]
      description: bci — игра на стенде, physical — физическая секция у волонтёра.

    DisciplineConfig:
      type: object
      required: [discipline, section, duration_s]
      additionalProperties: false
      properties:
        discipline:
          $ref: "#/components/schemas/Discipline"
        section:
          $ref: "#/components/schemas/Section"
        duration_s:
          type: integer
          minimum: 10
          maximum: 3600
          description: |
            Время сессии: для станции — время игры, для волонтёра — время
            физической дисциплины. На стенде по истечении игра завершается с
            текущими очками, на планшете это таймер для волонтёра.
      examples:
        - discipline: darts
          section: bci
          duration_s: 120

    Team:
      type: object
      required: [number, name, color]
      additionalProperties: false
      properties:
        number:
          type: integer
          minimum: 1
        name:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"

    TeamPatch:
      type: object
      required: [name, color]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 24
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"

    TeamInfo:
      type: object
      required: [id, number, name, color]
      additionalProperties: false
      properties:
        id:
          type: integer
        number:
          type: integer
          minimum: 1
        name:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"

    BoardTopEntry:
      type: object
      required: [rank, number, label, points, pending]
      additionalProperties: false
      properties:
        rank:
          type: integer
          minimum: 1
          maximum: 5
        number:
          type: integer
          description: Номер игрока в команде.
        label:
          type: string
          description: Имя или код участника.
        points:
          type: number
          description: Очки игрока в этой дисциплине, физическая + BCI.
        pending:
          type: boolean
          description: Секция в этой дисциплине в конфликте, нужно решение судьи.

    BoardTeam:
      type: object
      required: [rank, number, name, color, total, duel_score, by_discipline, sections_passed, finished, top]
      additionalProperties: false
      properties:
        rank:
          type: integer
          minimum: 1
        number:
          type: integer
          minimum: 1
        name:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        total:
          type: number
        duel_score:
          type: integer
          minimum: 0
          description: Победы команды в понге, один матч — одно очко.
        by_discipline:
          type: object
          description: Сумма очков команды по дисциплинам (физическая + BCI).
          additionalProperties:
            type: number
        sections_passed:
          type: integer
        finished:
          type: boolean
        top:
          type: object
          description: До 5 лучших игроков команды по каждой дисциплине.
          additionalProperties:
            type: array
            maxItems: 5
            items:
              $ref: "#/components/schemas/BoardTopEntry"

    Scoreboard:
      type: object
      required: [teams]
      additionalProperties: false
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/BoardTeam"

    IssueCode:
      type: string
      enum:
        - not_checked_in
        - already_completed
        - busy_on_other_station
        - no_pair_assigned

    Eligibility:
      type: object
      required: [code, team, issues]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/ParticipantCode"
        display_name:
          type: [string, "null"]
          description: Имя для табло, необязательно.
        team:
          oneOf:
            - $ref: "#/components/schemas/Team"
            - type: "null"
          description: null до жеребьёвки.
        issues:
          type: array
          items:
            $ref: "#/components/schemas/IssueCode"

    SessionId:
      type: string
      format: uuid
      description: UUID v4, генерирует лаунчер или планшет до начала игры / ввода.

    SessionStart:
      type: object
      required: [session_id, discipline, participant_codes]
      additionalProperties: false
      properties:
        session_id:
          $ref: "#/components/schemas/SessionId"
        discipline:
          $ref: "#/components/schemas/Discipline"
        participant_codes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ParticipantCode"

    Outcome:
      type: string
      enum: [completed, not_completed]

    NotCompletedReason:
      type: string
      enum: [participant_refused, health, equipment, no_show, other]

    ResultEntry:
      type: object
      required: [participant_code, outcome]
      additionalProperties: false
      properties:
        participant_code:
          $ref: "#/components/schemas/ParticipantCode"
        outcome:
          $ref: "#/components/schemas/Outcome"
        points:
          type: number
          minimum: 0
          maximum: 1000
          description: Очки по методике; шкалы задаются в настройках сервера.
        wins:
          type: integer
          minimum: 0
          maximum: 1
          description: |
            Победы в сессии, только для понга (для дартса и футбола — `invalid_entries`).
            Если оба игрока завершили, `wins` обязателен у обоих и ровно у одного равен 1.
            Если кто-то не завершил, у него `wins` нет; завершивший может передать `wins: 1`.
        reason:
          $ref: "#/components/schemas/NotCompletedReason"
        comment:
          type: string
          maxLength: 200
      allOf:
        - if:
            properties:
              outcome:
                const: completed
          then:
            required: [points]
            not:
              required: [reason]
          else:
            required: [reason]
            not:
              anyOf:
                - required: [points]
                - required: [wins]

    ResultSubmission:
      type: object
      required: [session_id, discipline, section, finished_at, entries]
      additionalProperties: false
      properties:
        session_id:
          $ref: "#/components/schemas/SessionId"
        discipline:
          $ref: "#/components/schemas/Discipline"
        section:
          $ref: "#/components/schemas/Section"
        finished_at:
          type: string
          format: date-time
          description: Время окончания по часам стенда / планшета.
        entries:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/ResultEntry"

    ResultStatus:
      type: string
      enum: [entered, confirmed, locked]
      description: введён → подтверждён → заблокирован.

    ResultReceipt:
      type: object
      required: [session_id, results, warnings]
      additionalProperties: false
      properties:
        session_id:
          $ref: "#/components/schemas/SessionId"
        results:
          type: array
          items:
            type: object
            required: [id, participant_code, status]
            additionalProperties: false
            properties:
              id:
                type: integer
              participant_code:
                $ref: "#/components/schemas/ParticipantCode"
              status:
                $ref: "#/components/schemas/ResultStatus"
        warnings:
          type: array
          items:
            type: object
            required: [participant_code, code]
            additionalProperties: false
            properties:
              participant_code:
                $ref: "#/components/schemas/ParticipantCode"
              code:
                $ref: "#/components/schemas/IssueCode"

    CorrectionStatus:
      type: string
      enum: [open, done]

    CorrectionCreate:
      type: object
      required: [session_id, comment]
      additionalProperties: false
      properties:
        session_id:
          $ref: "#/components/schemas/SessionId"
        comment:
          type: string
          minLength: 1
          maxLength: 200

    Correction:
      type: object
      required: [id, session_id, participant_codes, comment, created_at, status, resolved_at]
      additionalProperties: false
      properties:
        id:
          type: integer
        session_id:
          $ref: "#/components/schemas/SessionId"
        participant_codes:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantCode"
        comment:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/CorrectionStatus"
        resolved_at:
          type: [string, "null"]
          format: date-time

    StationState:
      type: string
      enum: [idle, confirming, calibrating, playing, sending]

    SensorState:
      type: string
      enum: [connected, connecting, disconnected, emulated]

    Heartbeat:
      type: object
      required: [state, queue_length, sensors]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/StationState"
        session_id:
          $ref: "#/components/schemas/SessionId"
        queue_length:
          type: integer
          minimum: 0
          maximum: 100000
          description: Результатов в офлайн-буфере.
        sensors:
          type: object
          description: Ключ — имя датчика (eeg, emg, emg_left, emg_right).
          maxProperties: 4
          propertyNames:
            enum: [eeg, emg, emg_left, emg_right]
          additionalProperties:
            $ref: "#/components/schemas/SensorState"

    DisciplineSettings:
      type: object
      required: [code, game_duration_s, physical_duration_s, win_points]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/Discipline"
        game_duration_s:
          type: integer
          minimum: 10
          maximum: 3600
        physical_duration_s:
          type: integer
          minimum: 10
          maximum: 3600
        win_points:
          type: integer
          minimum: 0
          maximum: 1000

    StationInfo:
      type: object
      required: [id, name, discipline, online, last_heartbeat_at, last_state, queue_length]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        discipline:
          $ref: "#/components/schemas/Discipline"
        online:
          type: boolean
          description: Последний heartbeat не старше 30 с.
        last_heartbeat_at:
          type: [string, "null"]
          format: date-time
        last_state:
          type: [string, "null"]
        queue_length:
          type: integer
          minimum: 0

    UserInfo:
      type: object
      required: [id, login, role, discipline, is_active]
      additionalProperties: false
      properties:
        id:
          type: integer
        login:
          type: string
        role:
          type: string
          enum: [superuser, admin, judge, volunteer]
        discipline:
          oneOf:
            - $ref: "#/components/schemas/Discipline"
            - type: "null"
        is_active:
          type: boolean

    StoredResult:
      type: object
      required:
        - id
        - session_id
        - participant_code
        - discipline
        - section
        - outcome
        - points
        - wins
        - reason
        - comment
        - status
        - source
        - finished_at
        - version
        - voided
      additionalProperties: false
      properties:
        id:
          type: integer
        session_id:
          type: string
        participant_code:
          $ref: "#/components/schemas/ParticipantCode"
        discipline:
          $ref: "#/components/schemas/Discipline"
        section:
          $ref: "#/components/schemas/Section"
        outcome:
          $ref: "#/components/schemas/Outcome"
        points:
          type: [number, "null"]
        wins:
          type: [integer, "null"]
        reason:
          type: [string, "null"]
        comment:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/ResultStatus"
        source:
          type: string
        finished_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
        voided:
          type: boolean

    StoredResultPage:
      type: object
      required: [total, items]
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/StoredResult"

    ResultPatch:
      type: object
      required: [change_reason]
      additionalProperties: false
      properties:
        points:
          type: number
          minimum: 0
          maximum: 1000
        wins:
          type: integer
          minimum: 0
          maximum: 1
        outcome:
          $ref: "#/components/schemas/Outcome"
        reason:
          $ref: "#/components/schemas/NotCompletedReason"
        comment:
          type: [string, "null"]
          maxLength: 200
        change_reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Почему исправлено (пробелы по краям отбрасываются); попадает в журнал аудита.

    ProblemCode:
      type: string
      enum:
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - too_many_attempts
        - invalid_request
        - unknown_participant
        - wrong_discipline
        - session_conflict
        - busy_on_other_station
        - invalid_entries
        - result_voided

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          $ref: "#/components/schemas/ProblemCode"
        errors:
          type: array
          description: Только для invalid_request; без введённых значений.
          items:
            type: object
            properties:
              loc:
                type: array
                items: {}
              msg:
                type: string
              type:
                type: string

[project]
name = "neurotlon_contracts"
version = "0.1.0"
description = "Result rules and schema validation shared by launcher and games"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurotlon_contracts"]

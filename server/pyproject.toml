[project]
name = "neurotlon_server"
version = "0.1.0"
description = "API, database, scoring and scoreboard stream"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurotlon_server"]

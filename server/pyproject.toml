[project]
name = "neurotlon_server"
version = "0.1.0"
description = "API, database, scoring and scoreboard stream"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.115",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.3",
    "reportlab>=5.1.0",
    "segno>=1.6.6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
neurotlon-server = "neurotlon_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurotlon_server"]
